<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LocalBites Search — Find local messes, canteens, home kitchens, and tiffin providers.">
    <meta name="theme-color" content="#FF6B35">
    <title>LocalBites — Search Food Services</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    
    <style>
        .search-container {
            padding: 24px 20px 60px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .suggest-title {
            font-size: 12px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .tag-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .suggest-tag {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #334155;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .suggest-tag:hover {
            border-color: #FF6B35;
            color: #FF6B35;
            background: rgba(255, 107, 53, 0.06);
        }

        .search-results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }
    </style>
</head>
<body class="page-shell" data-page="search">

    <!-- Global Top Navigation Header & Slide-Out Drawer -->
    {% include 'customer/_header.html' %}

    <!-- Ambient Blobs -->
    <div class="blob blob-tr"></div>
    <div class="blob blob-bl"></div>

    <!-- MAIN SEARCH CONTAINER -->
    <main class="search-container">
        
        <!-- Interactive Search Bar Wrapper -->
        <div class="search-wrapper" style="position: relative; width: 100%;">
            <span class="search-btn-icon" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; display: flex; align-items: center;">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" id="liveSearchInput" class="search-bar-input" placeholder="Search Mess, Home Kitchen, Tiffin, Canteen..." autofocus style="width: 100%; height: 48px; padding: 0 48px 0 48px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 15px; box-sizing: border-box; background: #ffffff;">
            <button class="voice-btn" onclick="LB.toast('Voice search is not connected in this browser.', 'info')" aria-label="Voice Search" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; padding: 6px; display: flex; align-items: center;">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            </button>
        </div>

        <!-- INITIAL SEARCH PREVIEW (hidden when typing) -->
        <div id="searchPreSuggestions" style="display: flex; flex-direction: column; gap: 24px;">
            
            <!-- Recent Searches (Cleaned up: Unnecessary search categories removed and replaced with dynamic history tracking) -->
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 class="suggest-title" style="margin-bottom: 0;">Recent Searches</h3>
                    <button type="button" id="clearAllHistory" style="background: none; border: none; font-size: 11px; font-weight: 700; color: #FF6B35; cursor: pointer;">Clear All</button>
                </div>
                <div class="tag-wrap" id="recentSearchesContainer">
                    <!-- Dynamically populated via local storage and updated interactively -->
                </div>
            </div>

            <!-- Suggested Categories -->
            <div>
                <h3 class="suggest-title">Suggested Categories</h3>
                <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;">
                    <button type="button" class="suggest-tag cat-link-tag" data-cat="mess">🍱 Mess</button>
                    <button type="button" class="suggest-tag cat-link-tag" data-cat="home_kitchen">🥘 Home Kitchen</button>
                    <button type="button" class="suggest-tag cat-link-tag" data-cat="tiffin_service">🍛 Tiffin</button>
                    <button type="button" class="suggest-tag cat-link-tag" data-cat="canteen">🏫 Canteen</button>
                    <button type="button" class="suggest-tag cat-link-tag" data-cat="poli_bhaji_kendra">🫓 Poli Bhaji</button>
                </div>
            </div>

        </div>

        <!-- LIVE SEARCH RESULTS CONTAINER (shown when typing) -->
        <div id="searchResultsSection" class="hidden">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                <span class="card-type" id="searchResultCount" style="font-size: 12px; font-weight: 800; color: #64748b; letter-spacing: 0.05em;">0 RESULTS FOUND</span>
                <button type="button" class="link-btn" id="btnClearSearch" style="font-size: 13px; color: #FF6B35; background: none; border: none; font-weight: 700; cursor: pointer;">Clear Search</button>
            </div>
            
            <!-- Result Grid -->
            <div class="search-results-grid" id="searchResultGrid"></div>

            <!-- Empty State -->
            <div id="searchEmptyState" class="hidden text-center" style="padding: 60px 0; text-align: center;">
                <div style="font-size: 4rem; margin-bottom: 16px;">🔍</div>
                <h3 style="font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 8px;">No Results Found</h3>
                <p style="font-size: 14px; color: #64748b; max-width: 340px; margin: 0 auto;">
                    We couldn't find any provider matching your query. Check spelling or try one of the suggestions.
                </p>
            </div>
        </div>

    </main>

    <div class="toast-host" aria-live="polite"></div>

    <!-- Script Links -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>

    <!-- Inline Script to Handle Real-World Search History Interaction (Task 1) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const recentContainer = document.getElementById("recentSearchesContainer");
            const clearAllBtn = document.getElementById("clearAllHistory");
            const searchInput = document.getElementById("liveSearchInput");

            // Initial default history if nothing in storage
            let recentSearches = JSON.parse(localStorage.getItem("localbites_search_history")) || [
                "student mess", "lunch tiffin", "poli bhaji kendra"
            ];

            function renderHistory() {
                recentContainer.innerHTML = "";
                if (recentSearches.length === 0) {
                    recentContainer.innerHTML = `<span style="font-size: 12px; color: #94a3b8;">No recent search history</span>`;
                    return;
                }

                recentSearches.forEach((term, index) => {
                    const tag = document.createElement("span");
                    tag.className = "suggest-tag recent-tag";
                    tag.style.display = "inline-flex";
                    tag.style.alignItems = "center";
                    tag.style.gap = "8px";
                    
                    tag.innerHTML = `
                        <span>${term}</span>
                        <i class="fa-solid fa-xmark remove-history-item" data-index="${index}" style="font-size: 11px; color: #94a3b8; cursor: pointer; padding: 2px;" title="Remove"></i>
                    `;

                    // Click text to populate search input
                    tag.querySelector("span").addEventListener("click", () => {
                        searchInput.value = term;
                        searchInput.dispatchEvent(new Event('input'));
                    });

                    // Click 'X' icon to remove individual item
                    tag.querySelector(".remove-history-item").addEventListener("click", (e) => {
                        e.stopPropagation();
                        recentSearches.splice(index, 1);
                        localStorage.setItem("localbites_search_history", JSON.stringify(recentSearches));
                        renderHistory();
                    });

                    recentContainer.appendChild(tag);
                });
            }

            clearAllBtn.addEventListener("click", () => {
                recentSearches = [];
                localStorage.removeItem("localbites_search_history");
                renderHistory();
            });

            renderHistory();
        });
    </script>
</body>
</html>
