<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Delivery - LocalBites</title>
    <link
    rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f8f8;
        }

        .tracking-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .tracking-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .tracking-title {
            margin: 0 0 10px;
            color: #222;
        }

        .tracking-status {
            color: #666;
            margin-bottom: 25px;
        }

        .map-container {
            width: 100%;
            height: 450px;
            background: #eeeeee;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="tracking-container">

        <div class="tracking-card">

            <h2 class="tracking-title">
                Track Your Delivery
            </h2>

            <p class="tracking-status">
                Your order is out for delivery.
            </p>

            <div id="map" class="map-container"></div>

        </div>

    </div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>
    const params = new URLSearchParams(window.location.search);

    const orderId = params.get('order_id');

    console.log('Tracking Order ID:', orderId);


    const map = L.map('map').setView(
        [19.0760, 72.8777],
        13
    );


    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    let deliveryMarker = null;


async function loadDeliveryLocation() {

    if (!orderId) {
        console.error('Order ID is missing.');
        return;
    }

    try {

        const response = await fetch(
            `/customer/api/orders/${orderId}/location`
        );

        const data = await response.json();

        console.log('Delivery location response:', data);


        if (!response.ok || !data.success) {

            console.error(
                'Could not get delivery location:',
                data.message
            );

            return;
        }


        const latitude = data.location.latitude;
        const longitude = data.location.longitude;


        // Remove the old marker
        if (deliveryMarker) {
            map.removeLayer(deliveryMarker);
        }


        // Create marker at the real delivery location
        deliveryMarker = L.marker([
            latitude,
            longitude
        ])
        .addTo(map)
        .bindPopup('Delivery Location')
        .openPopup();


        // Move map to delivery location
        map.setView(
            [latitude, longitude],
            16
        );


        console.log(
            'Delivery marker updated:',
            latitude,
            longitude
        );

    } catch (error) {

        console.error(
            'Error loading delivery location:',
            error
        );
    }
}


loadDeliveryLocation();

setInterval(
    loadDeliveryLocation,
    5000
);

</script>

</body>
</html>
