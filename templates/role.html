<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LocalBites — Choose your role to discover local food or manage your food business.">
    <meta name="theme-color" content="#FF6B35">
    <title>LocalBites — Choose Your Role</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <style>
        /* Third role card spans the full row under Customer / Business */
        .role-card.delivery-card { grid-column: 1 / -1; }
        .delivery-card .role-icon-wrap { background: linear-gradient(135deg,rgba(33,150,243,.1),rgba(33,150,243,.16)); border: 1.5px solid rgba(33,150,243,.22); }
        .role-card.delivery-card:hover { border-color: #2196F3; }
        .delivery-card .role-arrow { background: rgba(33,150,243,.1); color: #2196F3; }
        .delivery-card:hover .role-arrow { background: #2196F3; color: #fff; }
        @media (max-width: 480px) { .role-card.delivery-card .role-card-desc { display: block; } }
    </style>
</head>
<body class="page-shell" data-page="role">

    <!-- Ambient blobs -->
    <div class="blob blob-tr"></div>
    <div class="blob blob-bl"></div>
    <div class="blob blob-center"></div>

    <!-- Hero Header -->
    <header class="role-hero">
        <div class="role-logo-block">
            <img
                src="{{ url_for('static', filename='images/LocalBites.png') }}"
                alt="LocalBites"
                class="logo-img logo-img-lg"
                onerror="this.style.display='none'; document.getElementById('roleFb').style.display='flex';"
            >
            <div id="roleFb" style="display:none; width:80px; height:80px; position:relative;" aria-hidden="true">
                <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" width="80" height="80">
                    <defs><radialGradient id="pinG_role" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#FF8C5A"/><stop offset="100%" stop-color="#E55A25"/></radialGradient></defs>
                    <path d="M100 12 C65 12 37 40 37 75 C37 120 100 208 100 208 C100 208 163 120 163 75 C163 40 135 12 100 12Z" fill="url(#pinG_role)" opacity=".96"/>
                    <circle cx="100" cy="74" r="34" fill="white" opacity=".96"/>
                    <path d="M80 74 Q80 92 100 92 Q120 92 120 74" stroke="#FF6B35" stroke-width="3.2" fill="none" stroke-linecap="round"/>
                    <line x1="80" y1="74" x2="120" y2="74" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
                    <path d="M91 63 Q88 55 91 47" stroke="#2E7D32" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                    <path d="M100 60 Q97 52 100 44" stroke="#2E7D32" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                    <path d="M109 63 Q106 55 109 47" stroke="#2E7D32" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="wordmark wordmark-lg">
                <span class="l">Local</span><span class="b">Bites</span>
            </div>
        </div>

        <h1 class="role-headline">Welcome to <em>LocalBites</em></h1>
        <p class="role-subline">Choose your role to get started</p>
    </header>

    <!-- Role cards -->
    <main>
        <div class="role-grid">
            <!-- Customer -->
            <div class="role-card customer-card" id="customerCard" role="button" tabindex="0" aria-label="Continue as Customer">
                <div class="role-icon-wrap">👤</div>
                <h2 class="role-card-title">Customer</h2>
                <p class="role-card-desc">Discover nearby affordable local food</p>
                <div class="role-arrow">
                    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
            </div>

            <!-- Business -->
            <div class="role-card business-card" id="businessCard" role="button" tabindex="0" aria-label="Continue as Business">
                <div class="role-icon-wrap">🏪</div>
                <h2 class="role-card-title">Business</h2>
                <p class="role-card-desc">Register and manage your food business</p>
                <div class="role-arrow">
                    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
            </div>

        
        </div>
    </main>

    <!-- Toast host -->
    <div class="toast-host" aria-live="polite"></div>

    <!-- Script Links -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const customerCard = document.getElementById('customerCard');
            const businessCard = document.getElementById('businessCard');

            if (customerCard) {
                customerCard.addEventListener('click', e => {
                    LB.ripple(e, customerCard);
                    setTimeout(() => LB.navigate('/customer/login'), 380);
                });
            }
            const deliveryCard = document.getElementById('deliveryCard');
            if (deliveryCard) {
                deliveryCard.addEventListener('click', e => {
                    LB.ripple(e, deliveryCard);
                    setTimeout(() => LB.navigate('/delivery/login'), 380);
                });
            }
            if (businessCard) {
                businessCard.addEventListener('click', e => {
                    LB.ripple(e, businessCard);
                    setTimeout(() => LB.navigate('/business/login'), 380);
                });
            }
        });
    </script>
</body>
</html>
